name: Sync upstream

on:
  schedule:
    # Every day at 10:17 Asia/Shanghai (02:17 UTC).
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync "$GITHUB_REPOSITORY" --branch main
